[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "llm-from-scratch"
version = "0.1.0"
description = "Personal implementation notes and experiments for Build a Large Language Model (From Scratch)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "torch",
  "tiktoken",
  "numpy",
  "matplotlib",
  "jupyter",
  "pytest",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
